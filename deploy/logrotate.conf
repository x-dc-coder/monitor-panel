# monitor-panel 日志轮转（评审 D4）
# 安装: sudo install -m 644 deploy/logrotate.conf /etc/logrotate.d/monitor-panel
# 说明: 主日志走 journald（SystemMaxUse=200M）；此规则覆盖文件日志双份场景
#       7 天 × 10MB × 4 份，防磁盘涨满
/var/log/monitor-panel/*.log {
    daily
    rotate 4
    size 10M
    maxsize 10M
    missingok
    notifempty
    compress
    copytruncate
    su monitor monitor
}
